name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      # Never ship a bundle whose server cannot start.
      - name: Test before packing
        run: |
          uv sync --all-extras --dev
          uv run python -c "from apple_calendar_mcp import server; print(server.mcp.name)"
          uv run python tests/test_e2e.py --skip-live

      - name: Verify tag matches manifest version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match manifest version $VERSION"
            exit 1
          fi

      - name: Build extension
        run: ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "dist/apple-calendar.mcpb" \
            "dist/apple-calendar-${VERSION}.mcpb" \
          || gh release upload "$TAG" --clobber \
            "dist/apple-calendar.mcpb" \
            "dist/apple-calendar-${VERSION}.mcpb"
